name : Build Spring Boot App

on:
  push:
    branches : ["Aks_Test"]
  pull_request:
    branches:
      - "Aks_Test"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        working-directory: HelloAp
        run: mvn clean install

      - name: Run Tests
        working-directory: HelloAp
        run: mvn test

      - name: Log in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build Docker image
        working-directory: HelloAp
        run: docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/springboot-app:latest .

      - name: Push Docker image
        working-directory: HelloAp
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/springboot-app:latest






